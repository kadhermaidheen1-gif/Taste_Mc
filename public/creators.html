<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taste MC - All Creators</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #fdf8f5, #fff5f0); }
    nav { background: rgba(255,255,255,0.95); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; }
    .nav-logo { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #ff6b35, #f7931e); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nav-links { display: flex; gap: 2rem; list-style: none; }
    .nav-links a { text-decoration: none; color: #4a4a4a; cursor: pointer; }
    .btn { padding: 0.6rem 1.5rem; border-radius: 50px; border: none; cursor: pointer; font-weight: 600; text-decoration: none; }
    .btn-primary { background: linear-gradient(135deg, #ff6b35, #f7931e); color: white; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 20px; }
    h1 { text-align: center; margin-bottom: 2rem; color: #333; }
    .creators-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
    .creator-card { background: white; border-radius: 20px; padding: 1.5rem; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.05); transition: transform 0.3s; }
    .creator-card:hover { transform: translateY(-5px); }
    .avatar { width: 80px; height: 80px; background: linear-gradient(135deg, #ff6b35, #f7931e); border-radius: 50%; margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .creator-name { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
    .creator-speciality { color: #ff6b35; font-size: 0.9rem; margin-bottom: 0.5rem; }
    .creator-bio { color: #666; font-size: 0.85rem; margin-top: 0.5rem; }
    .back-btn { background: #ff6b35; color: white; border: none; padding: 10px 20px; border-radius: 25px; cursor: pointer; margin-bottom: 20px; }
    footer { text-align: center; padding: 2rem; color: #999; margin-top: 3rem; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">Taste<span>MC</span></div>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
      <li><a href="/creators.html">Creators</a></li>
      <li><a href="/explore.html">Explore</a></li>
    </ul>
  </nav>

  <div class="container">
    <button class="back-btn" onclick="window.location.href='/'">← Back to Home</button>
    <h1>🌟 All Creators</h1>
    <div class="creators-grid" id="creatorsGrid">
      <div style="text-align: center; padding: 2rem;">Loading creators...</div>
    </div>
  </div>

  <footer>&copy; 2025 Taste MC &mdash; Curating culture, one taste at a time.</footer>

  <script>
    async function loadCreators() {
      try {
        const res = await fetch('/api/creators');
        const data = await res.json();
        if (data.success && data.creators) {
          const grid = document.getElementById('creatorsGrid');
          const avatars = ['🍕', '👗', '🎵', '🎨', '🌿', '✈️', '💄', '🍜', '👠', '🎸'];
          grid.innerHTML = data.creators.map((c, i) => `
            <div class="creator-card">
              <div class="avatar">${avatars[i % avatars.length]}</div>
              <div class="creator-name">${escapeHtml(c.name)}</div>
              <div class="creator-speciality">${escapeHtml(c.speciality || 'Creator')}</div>
              <div class="creator-bio">${escapeHtml(c.bio || 'No bio yet.')}</div>
            </div>
          `).join('');
        }
      } catch (e) {
        document.getElementById('creatorsGrid').innerHTML = '<div style="text-align: center;">Failed to load creators</div>';
      }
    }
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, function(m) { if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; return m; }); }
    loadCreators();
  </script>
</body>
</html>
